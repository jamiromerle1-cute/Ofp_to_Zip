<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    h2 { margin-bottom: 20px; }
    .btn { width: 80%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; text-align: center; text-decoration: none; display: block; }
    .roblox { background: #000000; border: 1px solid #333; }
    .tiktok { background: #FE2C55; }
    .youtube { background: #FF0000; }
  </style>
</head>
<body>
  <h2>Fast Launcher</h2>
  <a href="https://www.roblox.com" class="btn roblox">Roblox</a>
  <a href="https://www.tiktok.com" class="btn tiktok">TikTok</a>
  <a href="https://www.youtube.com" class="btn youtube">YouTube</a>
</body>
</html>
